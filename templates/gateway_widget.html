<style>
  #gw-widget {
    position: fixed;
    bottom: 20px;
    right: 20px;
    z-index: 99999;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 13px;
  }
  .gw-container {
    background: #111920;
    border: 1px solid rgba(45,212,191,0.2);
    border-radius: 10px;
    padding: 12px 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    min-width: 180px;
  }
  .gw-header {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  #gw-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #888;
    flex-shrink: 0;
  }
  #gw-label {
    color: #7899aa;
    flex: 1;
  }
  .gw-btn-webui {
    background: #1e293b;
    color: #e0f0f0;
    text-decoration: none;
    border: 1px solid rgba(45,212,191,0.2);
    border-radius: 5px;
    padding: 4px 10px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }
  .gw-btn-restart {
    background: #2dd4bf;
    color: #0a0f14;
    border: none;
    border-radius: 5px;
    padding: 4px 12px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }
  .gw-btn-restart:disabled {
    opacity: 0.7;
    cursor: not-allowed;
  }
  #gw-vol {
    display: none;
    font-size: 11px;
    padding-top: 4px;
    border-top: 1px solid rgba(45,212,191,0.1);
  }
  .gw-ok { color: #4ade80; }
  .gw-warn { color: #fbbf24; }
  .gw-text { color: #7899aa; }
</style>

<div id="gw-widget">
  <div class="gw-container">
    <div class="gw-header">
      <span id="gw-dot"></span>
      <span id="gw-label">Gateway</span>
      <a href="/webui/" class="gw-btn-webui">WebUI</a>
      <button id="gw-btn" class="gw-btn-restart" onclick="gwRestart()">Restart</button>
    </div>
    <div id="gw-vol"></div>
  </div>
</div>

<script>
function gwStatus(){
  fetch('/api/gateway/status').then(r=>r.json()).then(d=>{
    document.getElementById('gw-dot').style.background=d.running?'#4ade80':'#ef4444';
    document.getElementById('gw-label').textContent=d.running?'Gateway running':'Gateway stopped';
    var vol=document.getElementById('gw-vol');
    vol.style.display='block';
    if(d.volume){
      vol.innerHTML='<span class="gw-ok">&#x2713;</span> <span class="gw-text">Volume attached</span>';
    }else{
      vol.innerHTML='<span class="gw-warn">&#x26A0;</span> <span class="gw-warn">No volume \u2014 data will not persist</span>';
    }
  }).catch(()=>{});
}
function gwRestart(){
  var b=document.getElementById('gw-btn');b.textContent='Restarting...';b.disabled=true;
  fetch('/api/gateway/restart',{method:'POST'}).then(()=>{
    setTimeout(()=>{b.textContent='Restart';b.disabled=false;gwStatus();},3000);
  }).catch(()=>{b.textContent='Restart';b.disabled=false;});
}
gwStatus();setInterval(gwStatus,10000);
</script>
